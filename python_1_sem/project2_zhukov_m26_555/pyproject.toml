[project]
name = "primitive-db"
version = "0.2.3"
description = "Консольная база данных с JSON-хранилищем и CRUD-командами"
authors = [
    { name = "nikita", email = "dayzwaitik123@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = ["prompt (>=0.4.1,<0.5.0)", "prettytable (>=3.18.0,<4.0.0)"]

[tool.poetry]
packages = [
    { include = "primitive_db", from = "src" },
]

[project.scripts]
database = "primitive_db.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py310"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 
[tool.poetry.group.dev.dependencies]
ruff = ">=0.16.8,<0.17.0"
