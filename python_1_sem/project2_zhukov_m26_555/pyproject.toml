[project]
name = "yes"
version = "0.1.3"
description = ""
authors = [
    { name = "nikita", email = "dayzwaitik123@yandex.ru" }
]
requires-python = ">=3.10"
dependencies = ["prompt (>=0.4.1,<0.5.0)"]

[tool.poetry]
packages = [
    { include = "src" },
]

[tool.poetry.scripts]
database = "src.primitive_db.main:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 88
target-version = "py312"
exclude = ["venv", ".venv", "dist", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [] 